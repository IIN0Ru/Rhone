<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>로운 — 파티원 고용 RPG 프로토타입</title>
<style>
@font-face{font-family:G11;src:url(Galmuri11.woff2) format('woff2')}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0d0a0c;color:#3a1a0a;font-family:G11,monospace;-webkit-font-smoothing:none;overflow:hidden}
img,canvas{image-rendering:pixelated;image-rendering:crisp-edges}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:960px;height:600px;flex:none;transform-origin:center;overflow:hidden;background:#000}
#cv{position:absolute;inset:0;width:960px;height:600px}
.hidden{display:none!important}
.wood{background:#e3a35c;border:4px solid #5a2a12;box-shadow:inset 0 0 0 4px #b8642a,inset 0 0 0 8px #f2c47a,6px 6px 0 rgba(0,0,0,.35);color:#3a1a0a}
.paper{background:#f6d9a0;box-shadow:inset 0 0 0 3px #b8642a}
button{font-family:G11,monospace;font-size:20px;cursor:pointer;color:#3a1a0a;background:#f6d9a0;border:0;box-shadow:inset 0 0 0 3px #b8642a;padding:8px 14px}
button:hover:not(:disabled){box-shadow:inset 0 0 0 3px #e2402e;background:#fbe6b8}
button:disabled{opacity:.45;cursor:not-allowed}
button.big{font-size:24px;padding:12px 26px;background:#f2c47a;box-shadow:inset 0 0 0 4px #5a2a12,inset 0 -6px 0 4px #b8642a}
button.sel{box-shadow:inset 0 0 0 4px #e2402e;background:#fbe6b8}
.dim{opacity:.72}
.ic{width:28px;height:28px;vertical-align:middle}
/* HUD */
#hud .clock{position:absolute;right:12px;top:12px;width:236px;padding:12px 14px;text-align:center;z-index:2}
#hud .clock .d{font-size:24px}#hud .clock .t{font-size:16px;margin:2px 0 8px}
#hud .clock .g{background:#3a1a0a;color:#f2d47a;font-size:26px;padding:3px 10px;display:flex;justify-content:flex-end;align-items:center;gap:6px;box-shadow:inset 0 0 0 3px #7a3a14}
#hud .clock .x{font-size:15px;margin-top:6px}
#hud .pty{position:absolute;left:12px;top:12px;display:flex;gap:8px;z-index:2}
#hud .pp{width:86px;padding:7px;text-align:center;cursor:pointer}
#hud .pp img.p{width:60px;height:60px;display:block;margin:0 auto;background:#f6d9a0;box-shadow:inset 0 0 0 3px #b8642a}
#hud .pp .n{font-size:16px;margin-top:2px;white-space:nowrap;overflow:hidden}
#hud .pp .h{line-height:0;margin-top:3px}#hud .pp .h img{width:18px;height:18px}
#hud .pp.low{animation:blink 1s steps(2) infinite}@keyframes blink{50%{background:#e2a090}}
#hud .hot{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:4px;padding:8px;z-index:2}
#hud .slot{width:62px;height:62px;position:relative;display:flex;align-items:center;justify-content:center;padding:0;font-size:15px;flex-direction:column}
#hud .slot img{width:40px;height:40px}
#hud .slot b{position:absolute;right:4px;bottom:1px;font-size:17px;color:#fff;text-shadow:2px 2px 0 #3a1a0a;font-weight:400}
#hud .slot s{position:absolute;left:4px;top:1px;font-size:13px;text-decoration:none;color:#7a3a14}
#hud.dun .hot{left:auto;right:12px;transform:none}
#toasts{position:absolute;left:12px;top:168px;display:flex;flex-direction:column;gap:6px;z-index:2;max-width:320px;pointer-events:none}
#toasts div{font-size:15px;padding:7px 11px;line-height:1.35;animation:tin .25s steps(3)}
@keyframes tin{from{transform:translateX(-30px);opacity:0}}
/* 전투 */
#bcmd{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);white-space:nowrap;display:flex;gap:14px;align-items:center;padding:10px 16px;z-index:3;font-size:17px}
#bcmd label{display:flex;align-items:center;gap:6px;font-size:16px}
#bcmd input{width:20px;height:20px;accent-color:#b8642a}
/* 대화창 */
#modal{position:absolute;inset:0;z-index:20;background:rgba(10,6,8,.22)}
#modalIn{position:absolute;left:28px;right:28px;bottom:14px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
#mch{padding:10px 12px;min-width:380px;max-width:640px;display:flex;flex-direction:column;gap:2px}
#mch button{text-align:left;background:transparent;box-shadow:none;font-size:22px;padding:6px 12px 6px 34px;position:relative}
#mch button.on{background:#f6d9a0;box-shadow:inset 0 0 0 3px #e2402e}
#mch button.on::before{content:'▶';position:absolute;left:10px;color:#e2402e}
#mch button:disabled{opacity:.4}
#mch small{font-size:16px;opacity:.75;margin-left:8px}
.dlg{width:100%;display:flex;padding:20px 22px;min-height:190px;max-height:330px}
.dlg .tx{flex:1;font-size:21px;line-height:1.5;overflow:auto;padding-right:14px}
.dlg .tx p{margin:0 0 8px}.dlg .tx h3{margin:0 0 8px;font-size:26px;font-weight:400;color:#7a2a12}
.dlg .tx b{color:#7a2a12;font-weight:400;text-decoration:underline}
.dlg .pf{width:186px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;border-left:4px solid #b8642a;padding-left:16px}
.dlg .pf img{width:150px;height:150px;background:#f6d9a0;box-shadow:inset 0 0 0 4px #b8642a}
.dlg .pf .nm{margin-top:6px;padding:3px 16px;font-size:20px}
.dlg .talkline{font-size:22px}
/* 메뉴 */

#menu .tabs{position:absolute;top:-56px;left:24px;display:flex;gap:6px}

#menu .tabs button.on{transform:translateY(8px);background:#f2c47a}
#menu .close{position:absolute;right:10px;top:10px;padding:4px 12px}
#menu h2{margin:0 0 10px;font-size:26px;font-weight:400}
#menu .body{flex:1;overflow:auto;padding-right:6px}
.row{display:flex;align-items:center;gap:14px;padding:10px;margin-bottom:8px}
.row img.p{width:72px;height:72px;background:#e3a35c;flex:none}
.row .hearts img{width:20px;height:20px;margin-right:1px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font-size:14px;padding:1px 7px;background:#e3a35c;box-shadow:inset 0 0 0 2px #b8642a;cursor:help}
.chip.h{opacity:.6}.chip.new{background:#f2d47a;box-shadow:inset 0 0 0 2px #e2402e}
.jl div{font-size:17px;padding:6px 4px;border-bottom:2px dashed #c8884a}
/* 인트로·엔딩 */
#screen{position:absolute;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;background:rgba(20,10,14,.35)}
.intro,.ending{width:620px;max-height:560px;overflow:auto;padding:26px 30px;text-align:center}
.intro h1,.ending h1{font-size:64px;font-weight:400;margin:0;color:#7a2a12;text-shadow:4px 4px 0 #f2c47a}
.intro p,.ending p{font-size:18px;line-height:1.6;margin:8px 0}
.intro input{font-family:G11;font-size:20px;padding:6px 10px;border:0;background:#f6d9a0;box-shadow:inset 0 0 0 3px #b8642a;width:150px;margin-left:8px;color:#3a1a0a}
.jobs{display:flex;gap:12px;justify-content:center;margin:12px 0}
.jobs button{min-width:180px}.jobs small{display:block;font-size:14px;opacity:.75}
.ending ul{list-style:none;padding:0;margin:10px auto;text-align:left;font-size:18px}.ending li{padding:5px 0;border-bottom:2px dashed #c8884a}
/* 터치 */
#touch{position:absolute;inset:0;z-index:4;pointer-events:none;display:none}
#touch .tb{pointer-events:auto;position:absolute;bottom:16px;width:86px;height:86px;font-size:30px;padding:0;background:#e3a35c;box-shadow:inset 0 0 0 4px #5a2a12,inset 0 0 0 8px #f2c47a;opacity:.92;touch-action:none;user-select:none;-webkit-user-select:none}
@media (hover:none){#touch{display:block}#hud .hot{left:auto;right:12px;transform:none;bottom:120px}}
#rot{position:fixed;left:0;right:0;top:0;padding:10px;text-align:center;background:#f2c14e;color:#2a1a1f;font-size:15px;display:none;z-index:99}
@media (orientation:portrait) and (hover:none){#rot{display:block}}
</style>
</head>

  <div id="menu" class="hidden wood"></div>
  <div id="screen" class="hidden"></div>

<script src="art9.js"></script>

async function advance(n) {
  for (let i = 0; i < n; i++) {
    G.day++;
    const heal = lodg().heal;
    for (const u of [G.player, ...G.party]) u.hp = Math.min(maxHp(u), Math.round(u.hp + maxHp(u) * heal));
    for (const m of G.party) {
      if (m.contract !== Infinity) {
        m.contract--;
        if (m.contract <= 0 && !m.renewPending) { m.renewPending = true; G.renewals.push(m.id); }
      }
    }
    if (G.day % 30 === 0) monthTick();
    if (G.day >= DEADLINE) { gameEnd('timeout'); return false; }
  }
  spawnCoins();
  renderUI();
  await processRenewals();
  return G.phase !== 'ending';
}
function spawnCoins() {
  const beggar = G.master === '은둔고수(거지)';
  G.coins = G.coins.filter(c => c.day >= G.day - 2);
  const n = beggar ? 3 : (R() < 0.6 ? 1 : 0);
  for (let i = 0; i < n; i++) G.coins.push({x: ri(2410, 2680), v: beggar ? ri(3, 8) : ri(1, 4), day: G.day});
}
function monthTick() {

  if (G.gold < L.cost) { G.lodging = 0; log('💸 숙박비를 낼 돈이 없어 마구간으로 옮겼다.'); }
  else if (L.cost) { G.gold -= L.cost; log(`🏨 ${L.name} 숙박비 ${L.cost}G를 냈다.`); }
  for (const m of G.party) {
    let d = 0;
    if (G.lodging < 0) d -= 6;
    else if (G.lodging === 0) {
      d -= 4;
      if (m.id === 'bark') { d -= 6; reveal(m, '술꾼'); log('🍺 바르크: "마구간에서 맨정신으로 자라고? 술값이라도 내놔."'); }
      if (m.id === 'yeon') { d -= 10; reveal(m, '자존심'); log('🥷 연소하: "말똥 냄새 나는 곳에서 검을 들 순 없다."'); }
      if (m.id === 'soso') { d += 7; log('👧 소소: "지붕 있는 데서 자는 게 얼마 만이지!"'); }
    } else if (G.lodging === 1) d += 1;
    else { d += 4; if (m.id === 'yeon') d += 4; }
    m.aff = clamp(m.aff + d, 0, 100);
  }

    getU('bark').aff = clamp(getU('bark').aff - 3, 0, 100); getU('yeon').aff = clamp(getU('yeon').aff - 3, 0, 100);

  }
  if (has('soso')) { const s = getU('soso'); s.lvl++; reveal(s, '성장형'); log('📈 소소가 부쩍 자랐다. (레벨 +1)'); }

  }

      if (m.id === 'yujin') leave(m, '고향으로 돌아갔다. "…너 많이 변했어."', true);

function willRenew(m) {
  if (m.aff < 25) return false;
  if (m.lvl > G.player.lvl + 2 && m.aff < 60) return R() < 0.3;
  return R() < 0.5 + m.aff / 100;
}
async function processRenewals() {
  while (G.renewals.length && G.phase !== 'ending') {
    const id = G.renewals.shift(); const m = getU(id);
    if (!m) continue;
    m.renewPending = false;
    if (!willRenew(m)) {
      const why = m.aff < 25 ? '"너랑은 여기까지야."' : '"나보다 약한 놈 밑에서 계속 일할 순 없지."';
      await modal(talkHtml(m, why) + `<p class="dim">${j(m.name, '이', '가')} 계약이 끝나자 재계약을 거절했다.</p>`, [{label: '보내준다'}]);
      leave(m, '계약이 끝나 떠났다.', false); continue;
    }
    const rate = TEMPLATES[id].rate;
    const opts = [1, 3, 6].map(mo => ({mo, price: priceOf(rate, mo)}));
    const v = await modal(talkHtml(m, '"계약이 끝났는데… 계속 같이 할까?"') + '<p>재계약 기간을 고르자.</p>',
      [...opts.map(o => ({label: `${o.mo}개월 · ${o.price}G`, value: o, disabled: G.gold < o.price})), {label: '보내준다', value: null, cls: 'ghost'}]);
    if (!v) { leave(m, '계약을 마치고 떠났다.', false); continue; }
    G.gold -= v.price; m.contract = v.mo * 30;
    log(`🤝 ${m.name}과(와) ${v.mo}개월 재계약했다. (-${v.price}G)`);
  }
  renderUI();
}

const sp = ms => sleep(ms * (G.fast ? 0.4 : 1));
function tween(o, props, ms) {
  return new Promise(res => { const from = {}; for (const k in props) from[k] = o[k]; tweens.push({o, from, to: props, t: 0, ms: Math.max(1, ms * (G.fast ? 0.4 : 1)), res}); });
}

function mkEnemy(type, x) { const e = ENEMIES[type]; return {...e, type, id: uid(), max: e.hp, state: 'ok', x, rot: 0, alpha: 1, flip: true}; }

function pickTarget() {
  const B = G.battle;
  const fl = B.enemies.filter(e => e.state === 'fleeing');

function obey(m) {

  [...G.party].reverse().forEach(m => {
    const tag = B ? (B.out[m.id] === 'fled' ? '도망' : B.out[m.id] === 'down' ? '쓰러짐' : '') : '';

    drawBubble(m, X(m.x), headY(m, GY - 72));
  });
  if (G.player) {
    drawActor(G.player, 44, {name: G.player.name, nameColor: '#f2c46d', walk: G.player.moving, hp: !!B, max: maxHp(G.player)});
    drawBubble(G.player, X(G.player.x), headY(G.player, GY - 74));
  }
  for (const p of projs) { ctx.strokeStyle = '#f2e6c8'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(X(p.x) - 14, p.y); ctx.lineTo(X(p.x) + 14, p.y); ctx.stroke(); emoji('✨', X(p.x) + 14, p.y + 8, 14); }
  for (const p of popups) { ctx.globalAlpha = 1 - p.t; txt(p.text, X(p.x), p.y - p.t * 40, 20, p.color, 'center', 700); ctx.globalAlpha = 1; }
  // 상호작용 안내
  if (!G.battle && !G.lock && !modalOpen && G.phase === 'world') {
    const it = nearest();
    if (it) {
      const label = `Space  ${it.label}`;
      ctx.font = '700 13px G11,sans-serif';
      const w = ctx.measureText(label).width + 20, x = clamp(X(it.x) - w / 2, 6, W - w - 6);
      rr(x, GY - 212, w, 30, 0, '#e3a35c', '#5a2a12'); txt(label, x + w / 2, GY - 192, 14, '#3a1a0a', 'center', 400);
    }
  }
  if (s !== 'town' && !FLOORS[s]) { const nm = ROOMNAME[s] || SC[s].name; ctx.font = '400 18px G11,sans-serif'; const w = ctx.measureText(nm).width + 28; rr(W / 2 - w / 2, 14, w, 34, 0, '#e3a35c', '#5a2a12'); txt(nm, W / 2, 38, 18, '#3a1a0a', 'center', 400); }
  ctx.restore();
}
const SPST = {};
function specialState(id) { return (SPST[id] = SPST[id] || {x: 0, icon: '', next: 2 + R() * 5}); }
function nearest() {
  if (!G.player) return null;
  let best = null, bd = 64;
  for (const it of interactables()) { const d = Math.abs(it.x - G.player.x); if (d < bd) { bd = d; best = it; } }
  return best;
}

// ================= 업데이트 =================
function update(dt) {
  tnow += dt * 1000;
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i]; tw.t += dt * 1000;
    const p = Math.min(1, tw.t / tw.ms), e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
    for (const k in tw.to) tw.o[k] = tw.from[k] + (tw.to[k] - tw.from[k]) * e;
    if (p >= 1) { tweens.splice(i, 1); tw.res(); }
  }
  for (let i = popups.length - 1; i >= 0; i--) { popups[i].t += dt * 1.1; if (popups[i].t >= 1) popups.splice(i, 1); }
  if (shake > 0) shake = Math.max(0, shake - dt);
  if (G.phase !== 'world' || !G.player) return;
  const s = G.scene, P = G.player, sw = SC[s].w;
  // NPC 배회 + 혼잣말
  for (const n of npcs(s)) {
    n.moving = false;
    if (n.range > 0) {
      n.wait -= dt;
      if (n.wait <= 0) { n.target = n.home + (R() * 2 - 1) * n.range; n.wait = 2 + R() * 4; }
      if (n.target != null && Math.abs(n.target - n.x) > 3) { const d = Math.sign(n.target - n.x); n.x += d * 45 * dt; n.flip = d < 0; n.moving = true; }
    }
    n.next -= dt;
    if (n.next <= 0) { n.next = 5 + R() * 8; if (Math.abs(n.x - P.x) < 500) bubble(n, pick(n.lines), 2200); }
  }
  for (const p of specials()) { const o = specialState(p.id); o.next -= dt; if (o.next <= 0) { o.next = 6 + R() * 6; if (Math.abs(p.x - P.x) < 450) bubble(o, pick(SPECIAL_LINES[p.id]), 2200); } }
  // 이동
  const canMove = !G.battle && !G.lock && !modalOpen && !menuOpen;
  let dir = 0;
  const dun = !!FLOORS[s] && !!G.run;
  if (canMove && !dun) { if (keys.left) dir -= 1; if (keys.right) dir += 1; }
  if (canMove && dun) {
    const stairsX = sw - 110;
    if (s === 'd2' && !G.run.knightAsked && !has('knight') && !G.gone.knight && P.x >= 1860) { G.run.knightAsked = true; runAct(knightEvent); }
    else if (P.x < stairsX || s === 'd3') dir = 1;
    else if (!G.run.atStairs && encounters().length === 0) { G.run.atStairs = true; runAct(stairsPrompt); }
  }
  P.moving = dir !== 0;
  if (dir) { P.x = clamp(P.x + dir * (dun ? 250 : 230) * dt, 30, s === 'd3' ? 1300 : sw - 30); P.flip = dir < 0; }
  // 동료 따라오기
  if (!G.battle) {
    let leader = P;
    G.party.forEach((m, i) => {
      const behind = leader.flip ? 74 : -74;
      const target = clamp(leader.x + behind, 20, sw - 20);
      const d = target - m.x;
      m.moving = Math.abs(d) > 6;
      if (m.moving) { m.x += Math.sign(d) * Math.min(Math.abs(d), (Math.abs(d) > 120 ? 330 : 225) * dt); m.flip = d < 0; }
      if (m.rot) m.rot = 0;
      leader = m;
    });
    // 가끔 동료 혼잣말
    G.idleT = (G.idleT || 8) - dt;
    if (G.idleT <= 0 && G.party.length) {
      G.idleT = 9 + R() * 9;
      const m = pick(G.party);
      const pool = (s === 'tavern' || s === 'inn') && m.lines.bar ? m.lines.bar : m.lines.idle;
      if (G.lodging < 0 && has('yujin') && R() < 0.6) bubble(getU('yujin'), pick(['오늘 밤 어디서 자? 여관 가볼까?', '마구간은 공짜래…', '길에서 자긴 싫어!']), 2600);
      else if (s === 'stable' && G.lodging === 0) bubble(m, pick(m.id === 'soso' ? ['여기 따뜻해요!'] : m.id === 'yeon' ? ['…말똥 냄새', '정말 여기서 자라고?'] : ['으, 냄새…', '건초가 따가워']), 2400);
      else if (s === 'lodge' && P.x > 1018) bubble(m, pick(['와… 침대 봐!', '우리도 여기서 자면 안 돼?', '부자들은 좋겠다']), 2400);
      else bubble(m, pick(pool), 2400);
    }
  }
  camX = clamp(P.x - W / 2, 0, Math.max(0, sw - W));
  if (G.battle) {
    const xs = [P.x, ...G.battle.enemies.map(e => e.x)];
    camX = clamp((Math.min(...xs) + Math.max(...xs)) / 2 - W / 2 + 40, 0, Math.max(0, sw - W));
  }
  // 동전 줍기
  if (s === 'town') {
    for (const c of [...G.coins]) if (Math.abs(c.x - P.x) < 20) { G.coins.splice(G.coins.indexOf(c), 1); G.gold += c.v; popup(c.x, GY - 70, `+${c.v}G`, '#ffd24a'); log(`🪙 골목에서 동전 ${c.v}G를 주웠다.`); renderHUD(); }
    if (P.x > 2392 && P.x < 2696) alleyCheck();
  }
  // 던전 조우
  if (FLOORS[s] && !G.battle && !G.lock && !modalOpen && G.run) {
    for (const e of encounters()) if (P.x > e.x - 150 && P.x < e.x + 260) { startBattle(e); break; }
  }
}
let lastT = 0;
function loop(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000 || 0.016); lastT = t;
  try { update(dt); draw(); } catch (err) { console.error(err); }
  requestAnimationFrame(loop);
}

// ================= 입력 =================
const KL = {ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right'};
addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  if (KL[e.key]) { keys[KL[e.key]] = true; e.preventDefault(); }
  if ((e.key === ' ' || e.key === 'ArrowUp' || e.key === 'e' || e.key === 'E' || e.key === 'Enter') && !e.repeat) {
    if (modalOpen) { if (e.key === 'ArrowUp') modalMove(-1); else modalPick(); e.preventDefault(); return; }
    e.preventDefault(); useAction();
  }
});
addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  if (modalOpen) { if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') { modalMove(1); e.preventDefault(); } if (e.key === 'w' || e.key === 'W') modalMove(-1); if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight')) e.preventDefault(); return; }
  if (e.key === 'Escape' || e.key === 'Tab' || e.key === 'i' || e.key === 'I') { e.preventDefault(); if (menuOpen) closeMenu(); else openMenu(e.key === 'i' || e.key === 'I' ? 'party' : null); return; }
  if (menuOpen) return;
  if (e.key === '1' && G.phase === 'world' && !G.lock && !G.battle && G.potions) runAct(ACT.usePotion);
  if (e.key === '2' && G.phase === 'world' && !G.lock && !G.battle && G.gifts && G.party.length) runAct(ACT.giveGift);
});
addEventListener('keyup', e => { if (KL[e.key]) keys[KL[e.key]] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
function useAction() {
  if (G.phase !== 'world' || G.lock || modalOpen || menuOpen) return;
  if (G.battle) { runAct(ACT.cmd, 'attack'); return; }
  const it = nearest(); if (!it) return;
  runAct(it.fn);
}
for (const b of document.querySelectorAll('[data-hold]')) {
  const k = b.dataset.hold;
  b.addEventListener('pointerdown', e => { keys[k] = true; e.preventDefault(); });
  for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) b.addEventListener(ev, () => { keys[k] = false; });
}
document.querySelector('[data-tap="use"]').addEventListener('click', useAction);
function runAct(fn, arg) {
  if (G.lock) return;
  G.lock = true; renderUI();
  Promise.resolve().then(() => fn(arg)).catch(err => { console.error(err); log('⚠️ 오류: ' + err.message); })
    .finally(() => { G.lock = false; renderUI(); });
}
const ACT = {
  job(a) { G.introJob = a; },
  async start() {
    const name = (G.introName || '').trim() || '도윤';
    const Wr = G.introJob === '전사';
    G.player = {id: 'player', name, icon: '🧑', job: G.introJob, lvl: 1, bhp: Wr ? 50 : 38, hpg: Wr ? 6 : 4, batk: Wr ? 9 : 11, atkg: Wr ? 1.5 : 1.9,
      bdef: Wr ? 4 : 2, defg: Wr ? 0.5 : 0.3, bHp: 0, bAtk: 0, bDef: 0, hp: 0, traits: [], x: 560, rot: 0, alpha: 1, flip: false,
      lines: {atk: ['간다!', '받아라!']}};
    G.player.hp = maxHp(G.player);
    G.party = [newMember('yujin')];
    G.phase = 'world';
    goScene('town', 420);
    spawnCoins();
    await sleep(300);
    bubble(getU('yujin'), `${name}, 우리 진짜 왔다!`, 2600);
    await modal(`<h3>첫날</h3>${talkHtml(TEMPLATES.yujin, `"${esc(name)}, 우리 진짜 왔다! 근데… 오늘 밤 어디서 자?"`)}
      <p>상경 자금은 <b>100골드</b>. 동료를 오래 고용할수록 숙소는 허름해지고, 숙소를 좋게 잡을수록 고용할 돈은 줄어든다.</p>
      <p>먼저 <b>오늘 밤 묵을 곳</b>을 찾아야 한다. 바로 옆 여관에는 일반실과 고급실이, 그 옆엔 공짜 마구간이 있다. 직접 들어가서 보고 침대(건초) 앞에서 정하자.</p>
      <p class="dim">← → 로 걷고, 문이나 사람·침대 앞에서 Space를 누른다.</p>`, [{label: '둘러보러 가자'}]);
    log('🌙 아직 묵을 곳이 없다. 여관(일반실·고급실)이나 마구간을 둘러보고 정하자.');
    log('🧭 술집·객잔·뒷골목에서 동료를 고용할 수 있다. 던전은 성문 밖 동쪽 끝에 있다.');
    bubble(getU('yujin'), '여관이랑 마구간, 둘 다 구경해 보자!', 2800);
  },
  async cmd(c) { if (G.battle) await doTurn(c); },
  menu() {},
  async dismiss(id) {
    const m = getU(id); if (!m) return;
    const ok = await modal(`<p>${j(m.name, '을', '를')} 파티에서 보낼까?</p><p class="dim">${id === 'yujin' ? '유진은 고향으로 돌아가고, 다시 돌아오지 않는다.' : '남은 계약금은 돌려받지 못한다.'}</p>`,
      [{label: '보낸다', value: true}, {label: '그만둔다', value: false, cls: 'ghost'}]);
    if (!ok) return;
    if (id === 'yujin') leave(m, '고향으로 돌아갔다. "…잘 지내."', true);
    else leave(m, '파티를 떠났다.', id === 'knight');
  },
  usePotion, giveGift,
  async save() { closeMenu(true); await saveGame(); },
  async load() { closeMenu(true); await loadGame(); },
  restart() { G = fresh(); for (const k in SPST) delete SPST[k]; }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const f = ACT[b.dataset.act]; if (!f) return;
  if (G.lock) return;
  if (b.dataset.act === 'job') { f(b.dataset.arg); renderUI(); return; }
  if (b.dataset.act === 'menu') { const a = b.dataset.arg; if (a === 'close') closeMenu(); else if (menuOpen && !b.closest('#hud')) { menuTab = a; renderMenu(); } else if (menuOpen) closeMenu(); else openMenu(a); return; }
  if (b.closest('#menu') && b.dataset.act === 'dismiss') closeMenu(true);
  runAct(f, b.dataset.arg);
});
function fit() { const k = Math.min(innerWidth / 960, innerHeight / 600); $('#stage').style.transform = `scale(${k})`; }
addEventListener('resize', fit); fit();
renderUI();
(function waitImgs(n) { const ok = Object.values(SPI).every(o => o.idle[0].complete); if (ok || n > 60) { for (const k in PORT) delete PORT[k]; renderUI(); } else setTimeout(() => waitImgs(n + 1), 80); })(0);
document.fonts && document.fonts.load('20px G11').then(() => renderUI());
requestAnimationFrame(loop);
</script>
